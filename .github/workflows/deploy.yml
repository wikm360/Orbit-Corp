name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # لود کردن متغیرهای محیطی در صورت استفاده از NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            cd /root/Organization-RAG

            # دریافت آخرین تغییرات کد
            git pull origin main

            # ورود به پوشه فرانت، نصب پکیج‌ها و بیلد مجدد
            cd Frontend
            npm install
            npm run build

            # ریستارت سریع سرویس فرانت‌اند
            systemctl restart front
