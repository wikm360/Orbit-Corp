name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}

          script: |
            exec bash -s <<'BASH'

            set -euo pipefail

            # Load NVM
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # Find the Orbit-Corp repository
            REPO_DIR=""

            FRONT_WORKDIR=$(systemctl show --property=WorkingDirectory --value front 2>/dev/null || true)

            if [ -n "$FRONT_WORKDIR" ]; then
              for candidate in "$FRONT_WORKDIR" "$(dirname "$FRONT_WORKDIR")"; do
                repo_root=$(git -C "$candidate" rev-parse --show-toplevel 2>/dev/null || true)

                [ -n "$repo_root" ] || continue

                origin=$(git -C "$repo_root" remote get-url origin 2>/dev/null || true)

                case "$origin" in
                  *wikm360/Orbit-Corp*)
                    REPO_DIR="$repo_root"
                    break
                    ;;
                esac
              done
            fi

            if [ -z "$REPO_DIR" ]; then
              while IFS= read -r git_dir; do
                candidate="${git_dir%/.git}"
                origin=$(git -C "$candidate" remote get-url origin 2>/dev/null || true)

                if [[ "$origin" == *wikm360/Orbit-Corp* ]]; then
                  REPO_DIR="$candidate"
                  break
                fi
              done < <(
                find /root /srv /opt /home /var/www /app \
                  -maxdepth 5 \
                  -type d \
                  -name .git \
                  -prune \
                  -print 2>/dev/null || true
              )
            fi

            if [ -z "$REPO_DIR" ]; then
              echo "Orbit-Corp checkout not found on server" >&2
              exit 1
            fi

            echo "Deploying from $REPO_DIR"

            cd "$REPO_DIR"

            # Force server repository to match GitHub main
            echo "Fetching latest code from GitHub..."
            git fetch origin main

            echo "Resetting local repository to origin/main..."
            git reset --hard origin/main

            echo "Current commit:"
            git log -1 --oneline

            # Build frontend
            echo "Building frontend..."

            cd Frontend

            npm install
            npm run build

            # Restart frontend service
            echo "Restarting frontend service..."

            systemctl restart front

            echo "Deployment completed successfully."

            BASH
