name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            echo "Shell: $0"
            echo "User: $(whoami)"
            echo "Home: $HOME"

            REPO_DIR=""

            # Find repository from the frontend systemd service
            FRONT_WORKDIR=$(systemctl show --property=WorkingDirectory --value front 2>/dev/null || true)

            if [ -n "$FRONT_WORKDIR" ]; then
              for candidate in "$FRONT_WORKDIR" "$(dirname "$FRONT_WORKDIR")"; do
                repo_root=$(git -C "$candidate" rev-parse --show-toplevel 2>/dev/null || true)

                [ -n "$repo_root" ] || continue

                origin=$(git -C "$repo_root" remote get-url origin 2>/dev/null || true)

                case "$origin" in
                  *wikm360/Orbit-Corp*)
                    REPO_DIR="$repo_root"
                    break
                    ;;
                esac
              done
            fi

            # Fallback: search common directories
            if [ -z "$REPO_DIR" ]; then
              REPO_DIR=$(
                find /root /srv /opt /home /var/www /app \
                  -maxdepth 5 \
                  -type d \
                  -name .git \
                  -prune \
                  -print 2>/dev/null |
                while IFS= read -r git_dir; do
                  candidate="${git_dir%/.git}"

                  origin=$(git -C "$candidate" remote get-url origin 2>/dev/null || true)

                  if printf '%s' "$origin" | grep -q 'wikm360/Orbit-Corp'; then
                    printf '%s\n' "$candidate"
                    break
                  fi
                done
              )
            fi

            if [ -z "$REPO_DIR" ]; then
              echo "Orbit-Corp checkout not found on server" >&2
              exit 1
            fi

            echo "Deploying from: $REPO_DIR"

            cd "$REPO_DIR"

            # Force server to exactly match GitHub main
            echo "Fetching latest code from GitHub..."
            git fetch origin main

            echo "Resetting local repository to origin/main..."
            git reset --hard origin/main

            echo "Current commit:"
            git log -1 --oneline

            # Start backend dependencies
            echo "Starting PostgreSQL and Redis..."
            docker compose --profile app up -d --wait postgres redis

            # Run database migrations
            echo "Running database migrations..."
            docker compose --profile app run \
              --rm \
              --no-deps \
              backend \
              alembic upgrade head

            # Rebuild and restart backend and worker
            echo "Building and restarting backend + worker..."
            docker compose --profile app up \
              -d \
              --build \
              --force-recreate \
              backend worker

            # Build frontend
            echo "Building frontend..."

            cd Frontend

            npm install

            npm run build

            # Restart frontend
            echo "Restarting frontend..."

            systemctl restart front

            echo "Deployment completed successfully."
