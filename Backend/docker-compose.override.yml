# DEV ONLY - auto-loaded by a plain `docker compose up`. Never used in production:
# production runs with COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in .env, which skips this file.
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"

networks:
  default:
    ipam:
      config:
        - subnet: 10.77.0.0/24
