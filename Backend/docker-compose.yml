name: backend

# اجرا (داخل پوشه‌ی Backend):
#   docker compose up --build -d
# ترتیب بالا آمدن: postgres + redis -> migrate (alembic upgrade head) -> backend + worker
# تنظیمات از فایل .env کنار همین فایل خوانده می‌شود؛ DATABASE_URL و REDIS_URL
# برای داخل شبکه‌ی Docker پایین بازنویسی می‌شوند، پس نیازی به تغییر localhost در .env نیست.

x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-org_rag}
    REDIS_URL: redis://redis:6379/0
    RAHKARAN_DB_HOST: mssql
    RAHKARAN_DB_PORT: 1433
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-org_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-org_rag}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: python -m workers.ingestion_worker
    # Each worker ingests one document at a time; more replicas drain a big
    # bulk upload faster (bounded in practice by the embedding API's rate limit).
    deploy:
      replicas: ${WORKER_REPLICAS:-3}
    volumes:
      - uploads_data:/app/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    restart: unless-stopped
    container_name: rahkaran-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${RAHKARAN_SA_PASSWORD:?set RAHKARAN_SA_PASSWORD in .env}
      # Express is the free production-licensed edition (10 GB/DB cap). "Developer" is NOT licensed for production;
      # set MSSQL_PID=Developer in your local .env only for development.
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_MEMORY_LIMIT_MB: "8192"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - rahkaran_mssql_data:/var/opt/mssql
      # Drop folder for the company's database export (FULL_/DIFF_ .bak files, any sub-folder). Read-only inside the container.
      - ${RAHKARAN_BACKUP_DIR:-./data/rahkaran-backups}:/backups:ro

  # One-shot job: loads the newest backup from the drop folder into SQL Server if it is newer than what is loaded
  # (no-op otherwise), applies the `ai` layer, swaps it in. Runs on every `up`; run it alone with:
  #   docker compose run --rm rahkaran-refresh [--dry-run|--force]
  rahkaran-refresh:
    build: .
    restart: "no"
    entrypoint: ["python", "sql/rahkaran/refresh.py"]
    environment:
      RAHKARAN_SA_PASSWORD: ${RAHKARAN_SA_PASSWORD:?set RAHKARAN_SA_PASSWORD in .env}
      RAHKARAN_AI_PASSWORD: ${RAHKARAN_DB_PASSWORD:?set RAHKARAN_DB_PASSWORD in .env}
      RAHKARAN_HOST: mssql
      RAHKARAN_PORT: "1433"
      RAHKARAN_DB: ${RAHKARAN_DB_NAME:-MehvarGostar}
    volumes:
      - ${RAHKARAN_BACKUP_DIR:-./data/rahkaran-backups}:/backups:ro
    depends_on:
      - mssql

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  rahkaran_mssql_data:
    external: true
